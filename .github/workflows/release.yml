name: Release

# Triggered when a release is created in the GitHub UI (draft or non-draft).
# This workflow is the *only* path that touches production: it builds and
# uploads desktop bundles, deploys the web build to Cloudflare Pages, and
# finally appends a "Try it on the web" link to the release body.
on:
  release:
    types: [created]

permissions:
  contents: write
  deployments: write

env:
  # Force Node 24 for JS actions that still ship Node 20
  # (currently cloudflare/wrangler-action@v3). Drop once upstream updates.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS .app + .dmg
            os: macos-latest
            bundles: app dmg
          - label: Windows NSIS
            os: windows-latest
            bundles: nsis
          - label: Linux AppImage
            os: ubuntu-22.04
            bundles: appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs bundles + auto-generates and uploads latest.json so the
          # in-app updater (tauri-plugin-updater) can verify and install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --bundles ${{ matrix.bundles }}

  web:
    name: Build & deploy web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check & build (web)
        run: bun run build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=differ --branch=main

  tidy-assets:
    # The .sig files are byproducts of bundle signing — their contents are
    # embedded inline in latest.json, which is what the runtime updater
    # actually reads. Removing them keeps the release page focused on the
    # bundles users (and the updater) actually need.
    name: Remove redundant .sig assets
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Delete .sig assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | .id' \
            | while read -r id; do
                echo "Deleting asset $id"
                gh api -X DELETE "repos/$REPO/releases/assets/$id"
              done

  link-web:
    name: Append web link to release notes
    needs: [build-tauri, web]
    runs-on: ubuntu-latest
    steps:
      - name: Append web link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          WEB_URL: https://differ.issaminu.com
        run: |
          set -euo pipefail
          marker="<!-- web-link -->"
          existing=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq .body)
          if printf "%s" "$existing" | grep -qF "$marker"; then
            echo "Web link already present; nothing to do."
            exit 0
          fi
          new_body=$(printf '%s\n\n%s\n## Try it on the web\nLive build: %s\n' \
            "$existing" "$marker" "$WEB_URL")
          jq -n --arg body "$new_body" '{body: $body}' \
            | gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" --input -
