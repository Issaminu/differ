name: Release

# Triggered when you create a release in the GitHub UI (draft or non-draft).
# The matrix builds the desktop bundles and uploads them to that release;
# the final job appends a "Try it on the web" link to the release body.
#
# Production web deploys happen separately on every push to main (ci.yml),
# so we don't redeploy here — we just link.
on:
  release:
    types: [created]

permissions:
  contents: write

env:
  # Force Node 24 for JS actions that still ship Node 20
  # (currently cloudflare/wrangler-action@v3). Drop once upstream updates.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS .app
            os: macos-latest
            bundles: app
          - label: Windows NSIS
            os: windows-latest
            bundles: nsis
          - label: Linux AppImage
            os: ubuntu-22.04
            bundles: appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --bundles ${{ matrix.bundles }}

  link-web:
    name: Append web link to release notes
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Append web link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          WEB_URL: https://differ.issaminu.com
        run: |
          set -euo pipefail
          marker="<!-- web-link -->"
          existing=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq .body)
          if printf "%s" "$existing" | grep -qF "$marker"; then
            echo "Web link already present; nothing to do."
            exit 0
          fi
          new_body=$(printf '%s\n\n%s\n## Try it on the web\nLive build: %s\n' \
            "$existing" "$marker" "$WEB_URL")
          jq -n --arg body "$new_body" '{body: $body}' \
            | gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" --input -
