name: CI

# Verification-only CI: typecheck + build the web bundle on every push and PR.
# Production web deploys happen exclusively on release creation (release.yml),
# so this workflow never touches Cloudflare.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check & build (web)
        run: bun run build:web
