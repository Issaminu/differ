[package]
name = "differ-native"
version = "0.1.0"
edition = "2021"
description = "Differ desktop app on GPUI (native, GPU-accelerated). Phase 0 spike."
license = "MIT"
publish = false

# gpui + gpui_platform come from the zed repo. Pinned to the exact commit our
# vendored gpui-component fork was built against, so the two resolve to one
# unified gpui (a version skew would break Entity<InputState> types).
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "35ffa8f480838257ae9650027cb9847505a0882b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "35ffa8f480838257ae9650027cb9847505a0882b", features = ["font-kit"] }
# FORKED gpui-component (vendored under vendor/) — we add a diff-highlight API to
# the editor so diff tints render inside the editor (no overlay). tree-sitter-
# languages pulls in all grammars for multi-language auto-detection.
gpui-component = { path = "../vendor/gpui-component/crates/ui", features = ["tree-sitter-languages"] }
differ-core = { path = "../crates/differ-core" }
