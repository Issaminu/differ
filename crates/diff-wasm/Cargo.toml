[package]
name = "differ-diff-wasm"
version = "0.1.0"
edition = "2021"
description = "imara-diff wrapped for use from the Differ frontend"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
imara-diff = "0.2"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
# wasm size + speed: opt-level 3, fat LTO, single codegen unit.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
